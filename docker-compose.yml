version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: algovis-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-algovis}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - algovis_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-algovis}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  algovis_postgres_data:
    name: algovis_postgres_data
